name: Quality PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build + Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantum_devflow?sslmode=disable
          AUTH_SECRET: test-secret-for-ci-only
          AUTH_URL: http://localhost:3000
          EMAIL_SERVER_HOST: smtp.example.com
          EMAIL_SERVER_PORT: 465
          EMAIL_SERVER_USER: ci@example.com
          EMAIL_SERVER_PASSWORD: ci-password
          EMAIL_FROM: Quantum CI <ci@example.com>
          EMAIL_ADMIN: admin@example.com
          ADMIN_EMAIL: admin@example.com
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          STRIPE_MOCK: "true"
          GEMINI_API_KEY: ci-placeholder
          N8N_WEBHOOK_URL: https://example.test/webhook/lead
          NODE_ENV: production
        run: npm run build