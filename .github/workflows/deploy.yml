name: Deploy → EC2 Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node ──────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install & Build ─────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET:         ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:            ${{ secrets.NEXTAUTH_URL }}
          EMAIL_SERVER_HOST:       ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT:       ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER:       ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD:   ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM:              ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN:             ${{ secrets.EMAIL_ADMIN }}
          ADMIN_EMAIL:             ${{ secrets.ADMIN_EMAIL }}
          STRIPE_SECRET_KEY:       ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:   ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MOCK:             "false"
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          N8N_WEBHOOK_URL:         ${{ secrets.N8N_WEBHOOK_URL }}
          NODE_ENV:                production
        run: npm run build

      # ── 4. Empacotar artefato (exclui node_modules e src) ─────────────────
      - name: Create deploy package
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.* \
            prisma \
            --exclude='.next/cache'

      # ── 5. Enviar para EC2 via SCP ─────────────────────────────────────────
      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ubuntu
          key:         ${{ secrets.EC2_SSH_KEY }}
          source:      deploy.tar.gz
          target:      /home/ubuntu/app-deploy

      # ── 6. Executar deploy no servidor ────────────────────────────────────
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/quantum-agency"

            # Extrai o build
            mkdir -p "$APP_DIR"
            tar -xzf /home/ubuntu/app-deploy/deploy.tar.gz -C "$APP_DIR"
            rm /home/ubuntu/app-deploy/deploy.tar.gz

            # Instala apenas dependências de produção
            cd "$APP_DIR"
            npm ci --omit=dev

            # Aplica migrations do Prisma
            npx prisma migrate deploy

            # Reinicia com PM2 (zero-downtime reload)
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
