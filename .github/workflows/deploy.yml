name: Deploy → EC2 Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install, Generate Prisma & Build ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          AUTH_SECRET:            ${{ secrets.AUTH_SECRET }}
          AUTH_URL:               ${{ secrets.AUTH_URL }}
          EMAIL_SERVER_HOST:      ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT:      ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER:      ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD:  ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM:             ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN:            ${{ secrets.EMAIL_ADMIN }}
          ADMIN_EMAIL:            ${{ secrets.ADMIN_EMAIL }}
          STRIPE_SECRET_KEY:      ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:  ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MOCK:            "false"
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          N8N_WEBHOOK_URL:        ${{ secrets.N8N_WEBHOOK_URL }}
          NODE_ENV:               production
        run: npm run build

      # ── 4. Empacotar artefato ─────────────────────────────────────────────
      - name: Create deploy package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.next/cache' \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.* \
            prisma

      # ── 5. Enviar para EC2 via SCP ────────────────────────────────────────
      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   deploy.tar.gz
          target:   /home/ubuntu/app-deploy

      # ── 6. Gravar env + Deploy ────────────────────────────────────────────
      - name: Write env & Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          V_DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          V_AUTH_SECRET:           ${{ secrets.AUTH_SECRET }}
          V_AUTH_URL:              ${{ secrets.AUTH_URL }}
          V_EMAIL_SERVER_HOST:     ${{ secrets.EMAIL_SERVER_HOST }}
          V_EMAIL_SERVER_PORT:     ${{ secrets.EMAIL_SERVER_PORT }}
          V_EMAIL_SERVER_USER:     ${{ secrets.EMAIL_SERVER_USER }}
          V_EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
          V_EMAIL_FROM:            ${{ secrets.EMAIL_FROM }}
          V_EMAIL_ADMIN:           ${{ secrets.EMAIL_ADMIN }}
          V_ADMIN_EMAIL:           ${{ secrets.ADMIN_EMAIL }}
          V_STRIPE_SECRET_KEY:     ${{ secrets.STRIPE_SECRET_KEY }}
          V_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          V_GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          V_N8N_WEBHOOK_URL:       ${{ secrets.N8N_WEBHOOK_URL }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs: V_DATABASE_URL,V_AUTH_SECRET,V_AUTH_URL,V_EMAIL_SERVER_HOST,V_EMAIL_SERVER_PORT,V_EMAIL_SERVER_USER,V_EMAIL_SERVER_PASSWORD,V_EMAIL_FROM,V_EMAIL_ADMIN,V_ADMIN_EMAIL,V_STRIPE_SECRET_KEY,V_STRIPE_WEBHOOK_SECRET,V_GEMINI_API_KEY,V_N8N_WEBHOOK_URL
          script: |
            set -e
            APP_DIR="/home/ubuntu/quantum-agency"
            mkdir -p "$APP_DIR"

            # Escreve .env.production.local sem heredoc (compativel com ssh-action)
            ENV_FILE="$APP_DIR/.env.production.local"
            printf 'NODE_ENV=production\n' > "$ENV_FILE"
            printf 'DATABASE_URL=%s\n' "$V_DATABASE_URL" >> "$ENV_FILE"
            printf 'AUTH_SECRET=%s\n' "$V_AUTH_SECRET" >> "$ENV_FILE"
            printf 'AUTH_URL=%s\n' "$V_AUTH_URL" >> "$ENV_FILE"
            printf 'EMAIL_SERVER_HOST=%s\n' "$V_EMAIL_SERVER_HOST" >> "$ENV_FILE"
            printf 'EMAIL_SERVER_PORT=%s\n' "$V_EMAIL_SERVER_PORT" >> "$ENV_FILE"
            printf 'EMAIL_SERVER_USER=%s\n' "$V_EMAIL_SERVER_USER" >> "$ENV_FILE"
            printf 'EMAIL_SERVER_PASSWORD=%s\n' "$V_EMAIL_SERVER_PASSWORD" >> "$ENV_FILE"
            printf 'EMAIL_FROM=%s\n' "$V_EMAIL_FROM" >> "$ENV_FILE"
            printf 'EMAIL_ADMIN=%s\n' "$V_EMAIL_ADMIN" >> "$ENV_FILE"
            printf 'ADMIN_EMAIL=%s\n' "$V_ADMIN_EMAIL" >> "$ENV_FILE"
            printf 'STRIPE_SECRET_KEY=%s\n' "$V_STRIPE_SECRET_KEY" >> "$ENV_FILE"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$V_STRIPE_WEBHOOK_SECRET" >> "$ENV_FILE"
            printf 'STRIPE_MOCK=false\n' >> "$ENV_FILE"
            printf 'GEMINI_API_KEY=%s\n' "$V_GEMINI_API_KEY" >> "$ENV_FILE"
            printf 'N8N_WEBHOOK_URL=%s\n' "$V_N8N_WEBHOOK_URL" >> "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            # Extrai o build
            tar -xzf /home/ubuntu/app-deploy/deploy.tar.gz -C "$APP_DIR"
            rm /home/ubuntu/app-deploy/deploy.tar.gz

            # Instala dependencias de producao
            cd "$APP_DIR"
            npm ci --omit=dev

            # Aplica migrations do Prisma passando DATABASE_URL diretamente
            DATABASE_URL="$V_DATABASE_URL" npx prisma migrate deploy

            # Reinicia com PM2 (zero-downtime reload)
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save