name: Deploy → EC2 Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          AUTH_SECRET:            ${{ secrets.AUTH_SECRET }}
          AUTH_URL:               ${{ secrets.AUTH_URL }}
          EMAIL_SERVER_HOST:      ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT:      ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER:      ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD:  ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM:             ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN:            ${{ secrets.EMAIL_ADMIN }}
          ADMIN_EMAIL:            ${{ secrets.ADMIN_EMAIL }}
          STRIPE_SECRET_KEY:      ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:  ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MOCK:            "false"
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          N8N_WEBHOOK_URL:        ${{ secrets.N8N_WEBHOOK_URL }}
          NODE_ENV:               production
        run: npm run build

      - name: Create deploy package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.next/cache' \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.* \
            prisma \
            prisma.config.ts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Envia o artefato para S3 — a EC2 vai baixar de lá (sem porta 22)
      - name: Upload artifact to S3
        run: |
          aws s3 cp deploy.tar.gz s3://${{ secrets.DEPLOY_BUCKET }}/deploy.tar.gz

      # Executa o deploy via SSM (sem SSH, sem porta 22)
      - name: Deploy via SSM
        run: |
          # Sanitiza o instance-id removendo qualquer whitespace/tab acidental
          INSTANCE_ID=$(echo "${{ secrets.EC2_INSTANCE_ID }}" | tr -d '[:space:]')
          echo "Instance ID: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "export HOME=/home/ubuntu",
              "export PATH=/home/ubuntu/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin",
              "[ -f /home/ubuntu/.nvm/nvm.sh ] && . /home/ubuntu/.nvm/nvm.sh",
              "[ -f /home/ubuntu/.bashrc ] && . /home/ubuntu/.bashrc 2>/dev/null || true",
              "command -v aws  || { echo FATAL: aws not found at $(find /usr /home/ubuntu /snap -name aws -type f 2>/dev/null | tr '\\n' ' '); exit 1; }",
              "command -v npm  || { echo FATAL: npm not found; exit 1; }",
              "APP_DIR=/home/ubuntu/quantum-agency",
              "mkdir -p $APP_DIR /home/ubuntu/app-deploy",
              "aws s3 cp s3://${{ secrets.DEPLOY_BUCKET }}/deploy.tar.gz /home/ubuntu/app-deploy/deploy.tar.gz",
              "ENV_FILE=$APP_DIR/.env.production.local",
              "printf \"%s\n\" \"NODE_ENV=production\" > $ENV_FILE",
              "printf \"%s\n\" \"DATABASE_URL=${{ secrets.DATABASE_URL }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"AUTH_SECRET=${{ secrets.AUTH_SECRET }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"AUTH_URL=${{ secrets.AUTH_URL }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"EMAIL_FROM=${{ secrets.EMAIL_FROM }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"EMAIL_ADMIN=${{ secrets.EMAIL_ADMIN }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"STRIPE_MOCK=false\" >> $ENV_FILE",
              "printf \"%s\n\" \"GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}\" >> $ENV_FILE",
              "printf \"%s\n\" \"N8N_WEBHOOK_URL=${{ secrets.N8N_WEBHOOK_URL }}\" >> $ENV_FILE",
              "chmod 600 $ENV_FILE",
              "tar -xzf /home/ubuntu/app-deploy/deploy.tar.gz -C $APP_DIR",
              "rm /home/ubuntu/app-deploy/deploy.tar.gz",
              "cd $APP_DIR",
              "npm ci --omit=dev",
              "export DATABASE_URL=${{ secrets.DATABASE_URL }}",
              "npx prisma migrate deploy",
              "pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs",
              "pm2 save"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Aguarda conclusão (máx 10 min)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy concluído com sucesso."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timeout aguardando o deploy."
          exit 1
