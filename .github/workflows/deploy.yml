name: Deploy → EC2 Production

on:
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE DE 3 CAMADAS
#
#  quality        → ESLint (security plugins) + npm audit
#  build          → prisma generate + next build + empacotamento S3   (needs: quality)
#  deploy         → SSM EC2 + PM2 reload                              (needs: build)
#
# O deploy NUNCA acontece se quality ou build falharem.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # CAMADA 1 — Qualidade & Segurança
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (security + no-secrets)
        # Foca nos ficheiros server-side onde vulnerabilidades são críticas.
        # TODO: Expandir para src/ completo após resolver os pre-existing no-html-link-for-pages
        run: npx eslint src/app/api/ src/lib/ --max-warnings=0

      - name: npm audit (bloqueia em Critical)
        # Tighten para --audit-level=high após resolver vulnerabilidades transitivas de deps
        run: npm audit --audit-level=critical

      - name: SonarCloud SAST
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # CAMADA 2 — Build & Empacotamento
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        env:
          DATABASE_URL:                ${{ secrets.DATABASE_URL }}
          AUTH_SECRET:                 ${{ secrets.AUTH_SECRET }}
          AUTH_URL:                    ${{ secrets.AUTH_URL }}
          EMAIL_SERVER_HOST:           ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT:           ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER:           ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD:       ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM:                  ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN:                 ${{ secrets.EMAIL_ADMIN }}
          ADMIN_EMAIL:                 ${{ secrets.ADMIN_EMAIL }}
          EMAIL_BASE_URL:              ${{ secrets.EMAIL_BASE_URL }}
          STRIPE_SECRET_KEY:           ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:       ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MOCK:                 "false"
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          N8N_WEBHOOK_URL:             ${{ secrets.N8N_WEBHOOK_URL }}
          NEXT_PUBLIC_SENTRY_DSN:      ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NODE_ENV:                    production
        run: npm run build

      - name: Create deploy package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.next/cache' \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.* \
            prisma \
            prisma.config.ts \
            ecosystem.config.cjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Gera .env via env vars (sem escaping) e envia artefatos para S3
      - name: Upload artifacts to S3
        env:
          DATABASE_URL:                ${{ secrets.DATABASE_URL }}
          AUTH_SECRET:                 ${{ secrets.AUTH_SECRET }}
          AUTH_URL:                    ${{ secrets.AUTH_URL }}
          EMAIL_SERVER_HOST:           ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT:           ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER:           ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD:       ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM:                  ${{ secrets.EMAIL_FROM }}
          EMAIL_ADMIN:                 ${{ secrets.EMAIL_ADMIN }}
          ADMIN_EMAIL:                 ${{ secrets.ADMIN_EMAIL }}
          EMAIL_BASE_URL:              ${{ secrets.EMAIL_BASE_URL }}
          STRIPE_SECRET_KEY:           ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:       ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          N8N_WEBHOOK_URL:             ${{ secrets.N8N_WEBHOOK_URL }}
          NEXT_PUBLIC_SENTRY_DSN:      ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          printf 'NODE_ENV=production\n'                                        > env.production.local
          printf 'DATABASE_URL=%s\n'          "$DATABASE_URL"                 >> env.production.local
          printf 'AUTH_SECRET=%s\n'           "$AUTH_SECRET"                  >> env.production.local
          printf 'AUTH_URL=%s\n'              "$AUTH_URL"                     >> env.production.local
          printf 'EMAIL_SERVER_HOST=%s\n'     "$EMAIL_SERVER_HOST"            >> env.production.local
          printf 'EMAIL_SERVER_PORT=%s\n'     "$EMAIL_SERVER_PORT"            >> env.production.local
          printf 'EMAIL_SERVER_USER=%s\n'     "$EMAIL_SERVER_USER"            >> env.production.local
          printf 'EMAIL_SERVER_PASSWORD=%s\n' "$EMAIL_SERVER_PASSWORD"        >> env.production.local
          printf 'EMAIL_FROM=%s\n'            "$EMAIL_FROM"                   >> env.production.local
          printf 'EMAIL_ADMIN=%s\n'           "$EMAIL_ADMIN"                  >> env.production.local
          printf 'ADMIN_EMAIL=%s\n'           "$ADMIN_EMAIL"                  >> env.production.local          printf 'EMAIL_BASE_URL=%s\n'        "$EMAIL_BASE_URL"               >> env.production.local          printf 'STRIPE_SECRET_KEY=%s\n'     "$STRIPE_SECRET_KEY"            >> env.production.local
          printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"        >> env.production.local
          printf 'STRIPE_MOCK=false\n'                                         >> env.production.local
          printf 'GEMINI_API_KEY=%s\n'        "$GEMINI_API_KEY"               >> env.production.local
          printf 'N8N_WEBHOOK_URL=%s\n'       "$N8N_WEBHOOK_URL"              >> env.production.local
          printf 'NEXT_PUBLIC_SENTRY_DSN=%s\n' "$NEXT_PUBLIC_SENTRY_DSN"      >> env.production.local
          chmod 600 env.production.local

          aws s3 cp deploy.tar.gz             s3://${{ secrets.DEPLOY_BUCKET }}/deploy.tar.gz
          aws s3 cp env.production.local      s3://${{ secrets.DEPLOY_BUCKET }}/env.production.local
          aws s3 cp scripts/deploy-remote.sh  s3://${{ secrets.DEPLOY_BUCKET }}/deploy-remote.sh

  # ──────────────────────────────────────────────────────────────────────────
  # CAMADA 3 — Deploy EC2
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy → EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          INSTANCE_ID=$(echo "${{ secrets.EC2_INSTANCE_ID }}" | tr -d '[:space:]')
          echo "Instance ID: $INSTANCE_ID"

          # Regenera presigned URLs (os arquivos já estão no S3 pelo job build)
          SCRIPT_URL=$(aws s3 presign "s3://${{ secrets.DEPLOY_BUCKET }}/deploy-remote.sh"    --expires-in 3600)
          DEPLOY_URL=$(aws s3 presign "s3://${{ secrets.DEPLOY_BUCKET }}/deploy.tar.gz"        --expires-in 3600)
          ENV_URL=$(aws    s3 presign "s3://${{ secrets.DEPLOY_BUCKET }}/env.production.local" --expires-in 3600)

          INNER="curl -fsSL '${SCRIPT_URL}' -o /tmp/deploy-remote.sh \
            && chmod +x /tmp/deploy-remote.sh \
            && bash /tmp/deploy-remote.sh '${DEPLOY_URL}' '${ENV_URL}' 2>&1"

          jq -n --arg cmd "su - ubuntu -c ${INNER@Q}" \
            '{"commands": [$cmd]}' > /tmp/ssm-params.json
          echo "SSM params:"; cat /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy concluído com sucesso."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timeout aguardando o deploy."
          exit 1

