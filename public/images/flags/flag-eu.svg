<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-label="Flag of Europe">
  <!-- Blue background -->
  <rect width="30" height="20" fill="#003399"/>
  <!-- 12 gold stars on a circle of radius 5.5 centered at (15,10) -->
  <defs>
    <polygon id="eu-star" fill="#FFCC00"
      points="0,-0.6 0.135,-0.186 0.571,-0.185 0.219,0.071 0.353,0.485 0,0.23 -0.353,0.485 -0.219,0.071 -0.571,-0.185 -0.135,-0.186"/>
  </defs>
  <use href="#eu-star" transform="translate(15,4.5)"/>
  <use href="#eu-star" transform="translate(17.75,5.24)"/>
  <use href="#eu-star" transform="translate(19.76,7.25)"/>
  <use href="#eu-star" transform="translate(20.5,10)"/>
  <use href="#eu-star" transform="translate(19.76,12.75)"/>
  <use href="#eu-star" transform="translate(17.75,14.76)"/>
  <use href="#eu-star" transform="translate(15,15.5)"/>
  <use href="#eu-star" transform="translate(12.25,14.76)"/>
  <use href="#eu-star" transform="translate(10.24,12.75)"/>
  <use href="#eu-star" transform="translate(9.5,10)"/>
  <use href="#eu-star" transform="translate(10.24,7.25)"/>
  <use href="#eu-star" transform="translate(12.25,5.24)"/>
</svg>
