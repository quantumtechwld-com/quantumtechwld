<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" fill="none" role="img" aria-label="QuantumTech">
  <title>QuantumTech</title>

  <!--
    Variante "partner" — uso em secções de logos de parceiros/clientes
    Regras:
    · Sem filtros de glow (compatibilidade máxima)
    · Monocromático — adapta-se por CSS opacity ao fundo do host
    · altura natural 32px, proporção 160×32
    · Símbolo reduzido (24×24) para equilibrar peso visual com logos externos
  -->

  <!-- Símbolo ∞ compacto (24×24, centrado verticalmente em y=4..28) -->
  <g transform="translate(0,0)">
    <!-- Loop esquerdo |0⟩ -->
    <path d="M14,16 C14,16 3,7 3,16 C3,25 14,16 14,16"
          stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Loop direito |1⟩ -->
    <path d="M14,16 C14,16 25,7 25,16 C25,25 14,16 14,16"
          stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Eixo horizontal de superposição -->
    <path d="M3,16 L25,16"
          stroke="#0A0A0A" stroke-width="0.5" stroke-linecap="round" opacity="0.40"/>

    <!-- Ring dashed no ponto de intersecção -->
    <circle cx="14" cy="16" r="3.8"
            stroke="#0A0A0A" stroke-width="0.4" stroke-dasharray="1.6 3.5" opacity="0.35"/>

    <!-- Nós extremos -->
    <circle cx="3"  cy="16" r="1.3" fill="#0A0A0A"/>
    <circle cx="25" cy="16" r="1.3" fill="#0A0A0A"/>

    <!-- Nó central -->
    <circle cx="14" cy="16" r="1.8" fill="#0A0A0A"/>
  </g>

  <!-- Separador vertical suave -->
  <line x1="34" y1="7" x2="34" y2="25"
        stroke="#0A0A0A" stroke-width="0.5" opacity="0.18"/>

  <!-- Wordmark -->
  <text x="42" y="21.5"
        font-family="'Geist Sans','Inter',system-ui,-apple-system,sans-serif"
        font-size="14" font-weight="600" letter-spacing="-0.2"
        fill="#0A0A0A">QuantumTech</text>
</svg>
