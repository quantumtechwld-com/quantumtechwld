<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" fill="none" role="img" aria-label="QuantumTech">
  <title>QuantumTech</title>
  <defs>
    <!-- Glow suave para paths e nós (melhora em browsers/presentations) -->
    <filter id="qt-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Símbolo de Superposição Quântica ∞ (40×40, y-offset 2px) ── -->
  <g transform="translate(2,2)">
    <!-- Glow blobs de fundo -->
    <circle cx="14" cy="20" r="9"  fill="#9B59FF" opacity="0.10"/>
    <circle cx="26" cy="20" r="9"  fill="#C084FC" opacity="0.12"/>

    <!-- Loop esquerdo — estado |0⟩ -->
    <path d="M20,20 C20,20 5,8 5,20 C5,32 20,20 20,20"
          stroke="#9B59FF" stroke-width="1.8" stroke-linecap="round" fill="none"
          filter="url(#qt-glow)"/>

    <!-- Loop direito — estado |1⟩ -->
    <path d="M20,20 C20,20 35,8 35,20 C35,32 20,20 20,20"
          stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" fill="none"
          filter="url(#qt-glow)"/>

    <!-- Eixo quântico (linha de superposição) -->
    <path d="M5,20 L35,20"
          stroke="#22D4C2" stroke-width="0.6" stroke-linecap="round" opacity="0.55"/>

    <!-- Ring dashed no ponto de intersecção -->
    <circle cx="20" cy="20" r="5.5"
            stroke="#9B59FF" stroke-width="0.5" stroke-dasharray="2 5" opacity="0.45"/>

    <!-- Nós extremos -->
    <circle cx="5"  cy="20" r="1.8" fill="#9B59FF" filter="url(#qt-glow)"/>
    <circle cx="35" cy="20" r="1.8" fill="#C084FC" filter="url(#qt-glow)"/>

    <!-- Nó central — ponto de intersecção -->
    <circle cx="20" cy="20" r="2.5" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="54" y="30"
        font-family="'Geist Sans','Inter',system-ui,-apple-system,sans-serif"
        font-size="20" font-weight="600" letter-spacing="-0.3">
    <tspan fill="#C4C4CC">Quantum</tspan><tspan fill="#9B59FF">Tech</tspan>
  </text>
</svg>
